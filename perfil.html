<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Completar Perfil</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Complete seu perfil</h1>

    <form id="perfil-form" class="form">
      <input type="text"  id="nome"  placeholder="Nome completo"   required>
      <input type="tel"   id="cel"   placeholder="Celular (DDD + nº)" required>
      <input type="text"  id="cpf"   placeholder="CPF" required maxlength="14">
      <input type="text"  id="end"   placeholder="Endereço completo" required>
      <button type="submit">Salvar perfil</button>
    </form>
  </div>

  <script src="js/perfil.js"></script>
</body>
</html>
